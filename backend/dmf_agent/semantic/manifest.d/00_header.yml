# ============================================================================
# 语义清单根（manifest.d）
# ----------------------------------------------------------------------------
# 多文件组织约定：
#   manifest.d/models/<模型>.yml        每个语义模型一个文件（含 entities/dimensions/measures）
#   manifest.d/metrics/<指标域>/<组>.yml 指标按业务域分子目录，同一域可再分组
# 加载器递归 glob 全部 *.yml 并按路径排序合并；跨文件 model/metric/measure
# 重名直接抛 ManifestError。校验入口：python -m dmf_agent.semantic check
# ============================================================================
version: 1
